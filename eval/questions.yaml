# Footnote evaluation set: 72 hand-written questions in eight categories.
#
# Gold figures are in millions of US dollars (EPS in dollars) and were entered by
# hand from the companies' published income statements and cash-flow statements,
# not copied from the system's database. Where the system and this file disagree,
# the disagreement is reported, not edited away.
#
# Fields
#   expect_status   statuses that count as correct for this question
#   expect_route    the route the question should take
#   gold            figures that must appear in the answer, formatted as the system formats them
#   gold_change     a percentage change (or percentage-point change) that must appear
#   order           companies in the order the answer must rank them
#   direction       rose or fell, for questions about a change
#   evidence        for document questions: company, fiscal year, section and a pattern
#                   at least one quoted passage must match
#   claim           for false-premise questions: whether the stated figure matches
#
# Questions R01 to R05 were added after the first full run, as regression cases for
# faults found while probing edge cases by hand (see docs/failure-analysis.md). The
# first run, on the original 67 questions, scored 95.5%.

